<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 4: Ancient Cipher | Codex Trail</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <style>.cipher-text { font-family: 'Courier Prime', monospace; font-size: 1.2rem; letter-spacing: 2px; background: #111; padding: 1.5rem; border-radius: 4px; text-align: center; margin: 2rem 0; }</style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Level 4: Caesar Cipher</h1>
      <div class="progress-bar"><div class="progress-fill" style="width: 50%;"></div></div>
    </header>
    <div class="puzzle-card fade-in">
      <h2>Decrypt the Message</h2>
      <p>This ancient cipher shifts letters by a fixed amount. <br> Hint: Rot13</p>
      <div class="cipher-text">Guvf vf abg whfg n punyyratr vg vf gur arkg ybbc bs lbhe gubhtugf</div>
      <form id="answer-form" class="answer-form">
        <input type="text" id="answer" placeholder="Enter decrypted message..." required>
        <button type="submit" class="btn btn-hover">Submit</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { checkAnswer } from '../assets/js/validation.js';

    const CURRENT_LEVEL_ID = 'level4';
    const NEXT_LEVEL_URL = '5-library.html';

    document.getElementById('answer-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitButton = e.target.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = 'Checking...';
      const isCorrect = await checkAnswer(CURRENT_LEVEL_ID, document.getElementById('answer').value);
      if (isCorrect) {
        e.target.closest('.puzzle-card').classList.add('success');
        setTimeout(() => { window.location.href = NEXT_LEVEL_URL; }, 1000);
      } else {
        e.target.closest('.puzzle-card').classList.add('error-shake');
        setTimeout(() => e.target.closest('.puzzle-card').classList.remove('error-shake'), 500);
        submitButton.disabled = false;
        submitButton.textContent = 'Submit';
      }
    });
  </script>
</body>
</html>
