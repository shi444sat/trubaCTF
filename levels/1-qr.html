<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 1: QR Initiation | Codex Trail</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Level 1: QR Initiation</h1>
      <div class="progress-bar"><div class="progress-fill" style="width: 0%;"></div></div>
    </header>
    <div class="puzzle-card fade-in">
      <h2>Scan the QR Code</h2>
      <img src="../assets/images/QR.png" alt="QR Code" class="qr-code pulse">
      <p class="hint-text">The first step is encoded. What does it reveal?</p>
      <form id="answer-form" class="answer-form">
        <input type="text" id="answer" placeholder="Enter decoded message..." required>
        <button type="submit" class="btn btn-hover">Submit</button>
      </form>
    </div>
  </div>

  <script type="module">
   import { checkAnswer } from '../assets/js/validation.js';

    const CURRENT_LEVEL_ID = 'level1';
    const NEXT_LEVEL_URL = '2-stego.html';

    document.getElementById('answer-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitButton = e.target.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = 'Checking...';
      const isCorrect = await checkAnswer(CURRENT_LEVEL_ID, document.getElementById('answer').value);
      if (isCorrect) {
        e.target.closest('.puzzle-card').classList.add('success');
        setTimeout(() => { window.location.href = NEXT_LEVEL_URL; }, 1000);
      } else {
        e.target.closest('.puzzle-card').classList.add('error-shake');
        setTimeout(() => e.target.closest('.puzzle-card').classList.remove('error-shake'), 500);
        submitButton.disabled = false;
        submitButton.textContent = 'Submit';
      }
    });
  </script>
</body>
</html>
